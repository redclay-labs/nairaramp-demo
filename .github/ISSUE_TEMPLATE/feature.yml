name: Feature Request
description: Propose a new feature or enhancement for nairaramp-demo
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or missing capability does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the proposed implementation or design approach.
    validations:
      required: true
  - type: checkboxes
    id: done-when
    attributes:
      label: Done when
      description: Acceptance criteria that must be satisfied.
      options:
        - label: Implementation complete and satisfies requirements
          required: true
        - label: Automated smoke or unit tests added and passing
          required: true
        - label: Documentation updated where relevant
          required: true
    validations:
      required: true
  - type: textarea
    id: files-to-touch
    attributes:
      label: Files to touch
      description: Which files in the codebase will be created or modified?
      placeholder: |
        - app/page.tsx
        - test/smoke.test.tsx
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Provide UI mockups, designs, or screenshots illustrating the feature.
      placeholder: Drag and drop mockups or paste image URLs here.
    validations:
      required: true
